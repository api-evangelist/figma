openapi: 3.2.0
info:
  title: Figma Library Analytics API
  contact:
    email: support@figma.com
  termsOfService: https://www.figma.com/developer-terms/
  version: '1.0'
  description: 'Operations tagged Library Analytics across 2 of this provider''s published API definitions: figma-analytics-api-openapi.yml, figma-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.figma.com
  description: Figma Production API Server
tags:
- name: Library Analytics
  description: Operations for retrieving library usage and action analytics data
paths:
  /v1/analytics/libraries/{file_key}/usages:
    get:
      tags:
      - Library Analytics
      summary: Figma Get Library Analytics Usage Data
      security:
      - PersonalAccessToken: []
      - OAuth2:
        - library_analytics:read
      description: Returns a list of library analytics usage data broken down by the requested dimension.
      operationId: getLibraryAnalyticsUsages
      x-microcks-operation:
        dispatcher: FALLBACK
        dispatcherRules: "{\n  \"dispatcher\": \"FALLBACK\",\n  \"fallback\": \"GetLibraryAnalyticsUsagesSuccessExample\"\n}\n"
      parameters:
      - $ref: '#/components/parameters/FileKeyPathParam'
      - $ref: '#/components/parameters/CursorQueryParam'
      - $ref: '#/components/parameters/GroupByQueryParam'
      - $ref: '#/components/parameters/OrderQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/GetLibraryAnalyticsUsagesResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    servers:
    - url: https://api.figma.com
      description: Figma Production API Server
  /v1/analytics/libraries/{file_key}/component/actions:
    get:
      tags:
      - Library Analytics
      summary: Get library analytics component action data
      security:
      - PersonalAccessToken: []
      - PlanAccessToken: []
      - OAuth2:
        - library_analytics:read
      description: Returns a list of library analytics component actions data broken down by the requested dimension.
      operationId: getLibraryAnalyticsComponentActions
      parameters:
      - name: file_key
        in: path
        description: File key of the library to fetch analytics data for.
        required: true
        schema:
          type: string
      - name: cursor
        description: Cursor indicating what page of data to fetch. Obtained from prior API call.
        in: query
        schema:
          type: string
      - name: group_by
        description: A dimension to group returned analytics data by.
        required: true
        in: query
        schema:
          type: string
          enum:
          - component
          - team
      - name: start_date
        description: ISO 8601 date string (YYYY-MM-DD) of the earliest week to include. Dates are rounded back to the nearest start of a week. Defaults to one year prior.
        in: query
        schema:
          type: string
      - name: end_date
        description: ISO 8601 date string (YYYY-MM-DD) of the latest week to include. Dates are rounded forward to the nearest end of a week. Defaults to the latest computed week.
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetLibraryAnalyticsComponentActionsResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponseWithErrorBoolean'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponseWithErrorBoolean'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponseWithErrorBoolean'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponseWithErrorBoolean'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponseWithErrorBoolean'
    servers:
    - url: https://api.figma.com
  /v1/analytics/libraries/{file_key}/component/usages:
    get:
      tags:
      - Library Analytics
      summary: Get library analytics component usage data
      security:
      - PersonalAccessToken: []
      - PlanAccessToken: []
      - OAuth2:
        - library_analytics:read
      description: Returns a list of library analytics component usage data broken down by the requested dimension.
      operationId: getLibraryAnalyticsComponentUsages
      parameters:
      - name: file_key
        in: path
        description: File key of the library to fetch analytics data for.
        required: true
        schema:
          type: string
      - name: cursor
        description: Cursor indicating what page of data to fetch. Obtained from prior API call.
        in: query
        schema:
          type: string
      - name: group_by
        description: A dimension to group returned analytics data by.
        required: true
        in: query
        schema:
          type: string
          enum:
          - component
          - file
      responses:
        '200':
          $ref: '#/components/responses/GetLibraryAnalyticsComponentUsagesResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponseWithErrorBoolean'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponseWithErrorBoolean'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponseWithErrorBoolean'
        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponseWithErrorBoolean'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponseWithErrorBoolean'
    servers:
    - url: https://api.figma.com
  /v1/analytics/libraries/{file_key}/style/actions:
    get:
      tags:
      - Library Analytics
      summary: Get library analytics style action data
      security:
      - PersonalAccessToken: []
      - PlanAccessToken: []
      - OAuth2:
