components:
  responses:
    ForbiddenErrorResponse:
      description: The request was valid, but the server is refusing action. The user might not have the necessary permissions for a resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponsePayload'
          examples:
            ForbiddenExample:
              $ref: '#/components/examples/ForbiddenExample'
    BadRequestErrorResponse:
      description: Bad request. Parameters are invalid or malformed. Please check the input formats.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponsePayload'
          examples:
            BadRequestExample:
              $ref: '#/components/examples/BadRequestExample'
    GetLibraryAnalyticsUsagesResponse:
      description: Response from the GET /v1/analytics/libraries/{file_key}/usages endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetLibraryAnalyticsUsagesResponseBody'
          examples:
            GetLibraryAnalyticsUsagesSuccessExample:
              $ref: '#/components/examples/GetLibraryAnalyticsUsagesSuccessExample'
    UnauthorizedErrorResponse:
      description: Token is missing or incorrect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponsePayload'
          examples:
            UnauthorizedExample:
              $ref: '#/components/examples/UnauthorizedExample'
    TooManyRequestsErrorResponse:
      description: API requests may be throttled or rate limited. Please wait a while before attempting the request again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponsePayload'
          examples:
            TooManyRequestsExample:
              $ref: '#/components/examples/TooManyRequestsExample'
    InternalServerErrorResponse:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponsePayload'
          examples:
            InternalServerErrorExample:
              $ref: '#/components/examples/InternalServerErrorExample'
    GetLibraryAnalyticsVariableUsagesResponse:
      description: Response from the PUT /v1/analytics/libraries/{file_key}/variable/usages.
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                description: An array of analytics data.
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsVariableUsagesByAsset'
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsVariableUsagesByFile'
              next_page:
                type: boolean
                description: Whether there is a next page of data that can be fetched.
              cursor:
                type: string
                description: The cursor to use to fetch the next page of data. Not present if next_page is false.
            required:
            - rows
            - next_page
    BadRequestErrorResponseWithErrorBoolean:
      description: Bad request. Parameters are invalid or malformed. Please check the input formats. This error can also happen if the requested resources are too large to complete the request, which results in a timeout. Please reduce the number and size of objects requested.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponsePayloadWithErrorBoolean'
            - type: object
              properties:
                status:
                  type: number
                  description: Status code
                  enum:
                  - 400
              required:
              - status
    ForbiddenErrorResponseWithErrorBoolean:
      description: The request was valid, but the server is refusing action. The user might not have the necessary permissions for a resource, or may need an account of some sort.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponsePayloadWithErrorBoolean'
            - type: object
              properties:
                status:
                  type: number
                  description: Status code
                  enum:
                  - 403
              required:
              - status
    GetLibraryAnalyticsStyleUsagesResponse:
      description: Response from the PUT /v1/analytics/libraries/{file_key}/style/usages.
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                description: An array of analytics data.
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsStyleUsagesByAsset'
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsStyleUsagesByFile'
              next_page:
                type: boolean
                description: Whether there is a next page of data that can be fetched.
              cursor:
                type: string
                description: The cursor to use to fetch the next page of data. Not present if next_page is false.
            required:
            - rows
            - next_page
    InternalServerErrorResponseWithErrorBoolean:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponsePayloadWithErrorBoolean'
            - type: object
              properties:
                status:
                  type: number
                  description: Status code
                  enum:
                  - 500
              required:
              - status
    UnauthorizedErrorResponseWithErrorBoolean:
      description: Token is missing or incorrect.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponsePayloadWithErrorBoolean'
            - type: object
              properties:
                status:
                  type: number
                  description: Status code
                  enum:
                  - 401
              required:
              - status
    TooManyRequestsErrorResponseWithErrorBoolean:
      description: In some cases API requests may be throttled or rate limited. Please wait a while before attempting the request again (typically a minute).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponsePayloadWithErrorBoolean'
            - type: object
              properties:
                status:
                  type: number
                  description: Status code
                  enum:
                  - 429
              required:
              - status
    GetLibraryAnalyticsStyleActionsResponse:
      description: Response from the GET /v1/analytics/libraries/{file_key}/style/actions.
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                description: An array of analytics data.
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsStyleActionsByAsset'
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsStyleActionsByTeam'
              next_page:
                type: boolean
                description: Whether there is a next page of data that can be fetched.
              cursor:
                type: string
                description: The cursor to use to fetch the next page of data. Not present if next_page is false.
            required:
            - rows
            - next_page
    GetLibraryAnalyticsVariableActionsResponse:
      description: Response from the GET /v1/analytics/libraries/{file_key}/variable/actions.
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                description: An array of analytics data.
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsVariableActionsByAsset'
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsVariableActionsByTeam'
              next_page:
                type: boolean
                description: Whether there is a next page of data that can be fetched.
              cursor:
                type: string
                description: The cursor to use to fetch the next page of data. Not present if next_page is false.
            required:
            - rows
            - next_page
    GetLibraryAnalyticsComponentUsagesResponse:
      description: Response from the PUT /v1/analytics/libraries/{file_key}/component/usages.
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                description: An array of analytics data.
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsComponentUsagesByAsset'
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsComponentUsagesByFile'
              next_page:
                type: boolean
                description: Whether there is a next page of data that can be fetched.
              cursor:
                type: string
                description: The cursor to use to fetch the next page of data. Not present if next_page is false.
            required:
            - rows
            - next_page
    GetLibraryAnalyticsComponentActionsResponse:
      description: Response from the GET /v1/analytics/libraries/{file_key}/component/actions.
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                description: An array of analytics data.
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsComponentActionsByAsset'
                - type: array
                  items:
                    $ref: '#/components/schemas/LibraryAnalyticsComponentActionsByTeam'
              next_page:
                type: boolean
                description: Whether there is a next page of data that can be fetched.
              cursor:
                type: string
                description: The cursor to use to fetch the next page of data. Not present if next_page is false.
            required:
            - rows
            - next_page
  examples:
    GetLibraryAnalyticsUsagesSuccessExample:
      summary: Successful library analytics usage response
      value:
        components:
        - componentKey: comp_abc123
          componentName: Primary Button
          componentSetKey: compset_xyz789
          componentSetName: Buttons
          numInstances: 1542
          numTeamsUsing: 8
          numFilesUsing: 45
        - componentKey: comp_def456
          componentName: Secondary Button
          componentSetKey: compset_xyz789
          componentSetName: Buttons
          numInstances: 876
          numTeamsUsing: 6
          numFilesUsing: 32
        files:
        - fileName: Marketing Landing Page
          teamName: Marketing Design
          workspaceName: Company Workspace
          numInstances: 89
        - fileName: Product Dashboard
          teamName: Product Design
          workspaceName: Company Workspace
          numInstances: 156
        nextPage: true
        cursor: eyJwYWdlIjoyfQ==
    UnauthorizedExample:
      summary: Unauthorized error
      value:
        error: true
        status: 401
        message: Token is missing or incorrect
    ForbiddenExample:
      summary: Forbidden error
      value:
        error: true
        status: 403
        message: You do not have permission to access analytics for this library
    TooManyRequestsExample:
      summary: Rate limit error
      value:
        error: true
        status: 429
        message: Rate limit exceeded. Please wait before making another request
    BadRequestExample:
      summary: Bad request error
      value:
        error: true
        status: 400
        message: 'Invalid parameter: group_by must be ''component'' or ''file'''
    InternalServerErrorExample:
      summary: Internal server error
      value:
        error: true
        status: 500
        message: An internal server error occurred
  parameters:
    OrderQueryParam:
      name: order
      description: How to order response rows by number of instances. This param can be either "asc" or "desc" (default).
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
      example: desc
    CursorQueryParam:
      name: cursor
      description: Cursor indicating what page of data to fetch. Obtained from prior API call.
      in: query
      schema:
        type: string
      example: eyJwYWdlIjoxfQ==
    GroupByQueryParam:
      name: group_by
      description: A dimension to group returned analytics data by. Accepts "component" or "file".
      required: true
      in: query
      schema:
        type: string
        enum:
        - component
        - file
      example: component
    FileKeyPathParam:
      name: file_key
      in: path
      description: File key of the library to fetch analytics data for.
      required: true
      schema:
        type: string
      example: abc123xyz789
  schemas:
    GetLibraryAnalyticsUsagesResponseBody:
      type: object
      properties:
        components:
          description: An array of analytics data when breaking down usage by component.
          type: array
          items:
            $ref: '#/components/schemas/LibraryAnalyticsUsagesByComponent'
          example: []
        files:
          description: An array of analytics data when breaking down usage by file.
          type: array
          items:
            $ref: '#/components/schemas/LibraryAnalyticsUsagesByFile'
          example: []
        nextPage:
          type: boolean
          description: Whether there is a next page of data that can be fetched.
          example: true
        cursor:
          type: string
          description: The cursor to use to fetch the next page of data. Not present if nextPage is false.
          example: example_value
      required:
      - nextPage
    LibraryAnalyticsUsagesByComponent:
      type: object
      description: Library analytics usage data broken down by component.
      properties:
        componentKey:
          type: string
          description: Unique, stable id of the component.
          example: example_value
        componentName:
          type: string
          description: Name of the component.
          example: example_value
        componentSetKey:
          type: string
          description: Unique, stable id of the component set that this component belongs to.
          example: example_value
        componentSetName:
          type: string
          description: Name of the component set that this component belongs to.
          example: example_value
        numInstances:
          type: number
          description: The number of instances of the component within the organization.
          example: 42.5
        numTeamsUsing:
          type: number
          description: The number of teams using the component within the organization.
          example: 42.5
        numFilesUsing:
          type: number
          description: The number of files using the component within the organization.
          example: 42.5
      required:
      - componentKey
      - componentName
      - numInstances
      - numTeamsUsing
      - numFilesUsing
    LibraryAnalyticsUsagesByFile:
      type: object
      description: Library analytics usage data broken down by file.
      properties:
        fileName:
          type: string
          description: The name of the file using the library.
          example: example_value
        teamName:
          type: string
          description: The name of the team the file belongs to.
          example: example_value
        workspaceName:
          type: string
          description: The name of the workspace that the file belongs to.
          example: example_value
        numInstances:
          type: number
          description: The number of component instances from the library used within the file.
          example: 42.5
      required:
      - fileName
      - teamName
