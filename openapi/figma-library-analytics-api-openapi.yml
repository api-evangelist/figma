    servers:
    - url: https://api.figma.com
  /v1/analytics/libraries/{file_key}/variable/actions:
    get:
      tags:
      - Library Analytics
      summary: Get library analytics variable action data
      security:
      - PersonalAccessToken: []
      - PlanAccessToken: []
      - OAuth2:
        - library_analytics:read
      description: Returns a list of library analytics variable actions data broken down by the requested dimension.
      operationId: getLibraryAnalyticsVariableActions
      parameters:
      - name: file_key
