        children:
          type: array
          description: An array of nodes that are direct children of this node
          items:
            $ref: '#/components/schemas/SubcanvasNode'
      required:
      - children
    BlendMode:
      type: string
      description: 'This type is a string enum with the following possible values


        Normal blends:

        - `PASS_THROUGH` (only applicable to objects with children)

        - `NORMAL`


        Darken:

        - `DARKEN`

        - `MULTIPLY`

        - `LINEAR_BURN`

        - `COLOR_BURN`


        Lighten:

        - `LIGHTEN`

        - `SCREEN`

        - `LINEAR_DODGE`

        - `COLOR_DODGE`


        Contrast:

        - `OVERLAY`

        - `SOFT_LIGHT`

        - `HARD_LIGHT`


        Inversion:

        - `DIFFERENCE`

        - `EXCLUSION`


        Component:

        - `HUE`

        - `SATURATION`

        - `COLOR`

        - `LUMINOSITY`'
      enum:
      - PASS_THROUGH
      - NORMAL
      - DARKEN
      - MULTIPLY
      - LINEAR_BURN
      - COLOR_BURN
      - LIGHTEN
      - SCREEN
      - LINEAR_DODGE
      - COLOR_DODGE
      - OVERLAY
      - SOFT_LIGHT
      - HARD_LIGHT
      - DIFFERENCE
      - EXCLUSION
      - HUE
      - SATURATION
      - COLOR
      - LUMINOSITY
    InstanceNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
