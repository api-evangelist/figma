        description: A multitone noise effect
        properties:
          noiseType:
            type: string
            description: The string literal 'MULTITONE' representing the noise type.
            enum:
            - MULTITONE
          opacity:
            type: number
            description: The opacity of the noise effect
        required:
        - noiseType
        - opacity
      - $ref: '#/components/schemas/BaseNoiseEffect'
    LayoutGrid:
      type: object
      description: Guides to align and place objects within a frames.
      properties:
        pattern:
          type: string
          description: 'Orientation of the grid as a string enum


            - `COLUMNS`: Vertical grid

            - `ROWS`: Horizontal grid

            - `GRID`: Square grid'
          enum:
          - COLUMNS
          - ROWS
          - GRID
        sectionSize:
          type: number
          description: Width of column grid or height of row grid or square grid spacing.
        visible:
          type: boolean
          description: Is the grid currently visible?
        color:
          $ref: '#/components/schemas/RGBA'
          description: Color of the grid
        alignment:
          type: string
          description: 'Positioning of grid as a string enum


            - `MIN`: Grid starts at the left or top of the frame

            - `MAX`: Grid starts at the right or bottom of the frame

            - `STRETCH`: Grid is stretched to fit the frame

            - `CENTER`: Grid is center aligned'
          enum:
          - MIN
          - MAX
          - STRETCH
          - CENTER
        gutterSize:
          type: number
          description: Spacing in between columns and rows
        offset:
          type: number
          description: Spacing before the first column or row
        count:
          type: number
          description: Number of columns or rows
        boundVariables:
          type: object
          description: The variables bound to a particular field on this layout grid
          properties:
            gutterSize:
              $ref: '#/components/schemas/VariableAlias'
            numSections:
              $ref: '#/components/schemas/VariableAlias'
            sectionSize:
              $ref: '#/components/schemas/VariableAlias'
            offset:
              $ref: '#/components/schemas/VariableAlias'
      required:
      - pattern
      - sectionSize
      - visible
      - color
      - alignment
      - gutterSize
      - offset
      - count
