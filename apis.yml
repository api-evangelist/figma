- type: Features
  data:
  - Starter free with unlimited drafts and 150-500 AI credits/mo
  - Professional at $16/full-seat/mo with team libraries and MCP Server
  - Organization at $55/full-seat/mo with shared libraries and centralized admin
  - Enterprise at $90/full-seat/mo with design system APIs and SCIM
  - REST API for files, projects, components, comments
  - Plugin API for in-editor extensions
  - Widget API for FigJam interactive widgets
  - Variables API for design token management
  - Webhooks v2 for file and library updates
  - OAuth 2.0 with granular scopes
  - Personal access tokens for scripts/automation
  - Dev Mode for handoff and code generation
  - Dev Mode MCP Server for AI design integration
  - FigJam whiteboarding included
  - Variables and modes for design system theming (Enterprise)
  - Branching and merging on Organization+
  sources:
  - https://www.figma.com/pricing/
  updated: '2026-05-04'
- type: UseCases
  data:
  - name: Design System Management
    description: Build, publish, and track adoption of shared component libraries
      across product teams.
  - name: Automated Asset Export
    description: Programmatically export design assets for build pipelines and content
      delivery workflows.
  - name: Design-to-Code Handoff
    description: Attach code references to design nodes using dev resources for seamless
      developer handoff.
  - name: Plugin and Widget Development
    description: Extend Figma with custom plugins and widgets using the Plugin API
      and Widget API.
  - name: Compliance and Audit
    description: Monitor organization activity logs for security compliance and access
      auditing.
  - name: Design File Backup
    description: Programmatically back up file data and version history for disaster
      recovery.
- type: Integrations
  data:
  - name: Slack
    description: Receive Figma file update notifications and preview designs directly
      in Slack channels.
  - name: Jira
    description: Embed Figma designs in Jira issues and link design tasks to development
      tickets.
  - name: GitHub
    description: Link Figma designs to pull requests and track design-to-code implementation.
  - name: Storybook
    description: Connect Figma components to Storybook stories using Code Connect
      for design-code parity.
  - name: Zeplin
    description: Export designs from Figma to Zeplin for detailed developer handoff
      and style guides.
  - name: Abstract
    description: Version control and branching for Figma design files with Abstract
      integration.
  - name: Microsoft Teams
    description: Share and preview Figma designs within Microsoft Teams conversations
      and channels.
